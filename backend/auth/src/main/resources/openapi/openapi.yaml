openapi: 3.1.0
info:
  title: Fennixs Auth API
  version: 0.0.1
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDto'
      responses:
        '201':
          description: User registered successfully
        '403':
          description: Invalid or missing setup token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: A resource with the provided data already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    ValidationProblemDetail:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
              description: Map of field name to validation error message
    RegisterRequestDto:
      type: object
      required:
        - email
        - password
      properties:
        setupToken:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
