spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fennixs_auth
    username: fennixs
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      secret: dev-secret-key-do-not-use-in-production
      access-token-expiration-ms: 900000
    cookie-secure: false
    cors-allowed-origins:
      - http://localhost:4200

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.fennixs.auth: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
