name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      # The action names a version output after each released package path.
      # A job output cannot be built from a path it only learns at run time, so
      # every package in release-please-config.json adds its own line here.
      keycloak-version: ${{ steps.release.outputs['keycloak--version'] }}
    steps:
      # Publishing runs as a job here, not as a workflow triggered by the tag.
      # A tag pushed with GITHUB_TOKEN starts no other workflow, so a tag
      # trigger would silently never run without a personal access token.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign signs with the run's OIDC identity rather than a stored key.
      id-token: write
    strategy:
      matrix:
        # The released path is also the build context and the image name,
        # because every service sits at the repository root.
        path: ${{ fromJSON(needs.release.outputs.paths_released) }}
    env:
      GHCR_IMAGE: ghcr.io/rodrigouma04/fennixs-${{ matrix.path }}
      DOCKERHUB_IMAGE: docker.io/rodrigouma04/fennixs-${{ matrix.path }}
      VERSION: ${{ needs.release.outputs[format('{0}-version', matrix.path)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 for self-hosters on Raspberry Pis and ARM VPSes. It builds under
      # emulation: 94s against 7.5s native, not worth a native ARM runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No registry means Docker Hub, which docker-compose.yml pulls from, so
      # the whole stack comes from one registry. The username is the namespace
      # written below, so only the token is a secret.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: rodrigouma04
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest is what docker-compose.yml names, so it moves on every release.
      # The major-only tag starts at 1.0.0: before that, a bare 0 would span
      # every breaking change.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ !startsWith(env.VERSION, '0.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What an operator runs is this image, not the commits behind it, so
          # the build provenance and the component list travel with it.
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signing the artifact a self-hoster actually runs, which is worth more
      # here than signing the commits it was built from. The digest comes from
      # the build step so the signature covers what was pushed, not a tag that
      # could later move.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${GHCR_IMAGE}@${DIGEST}" "${DOCKERHUB_IMAGE}@${DIGEST}"
