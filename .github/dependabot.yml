version: 2
# Every entry below waits seven days on a new release: long enough for a compromised
# or yanked version to be reported by someone else before it reaches a pull request
# here, and nothing in this repository needs a bump sooner. Dependabot's own default
# is three days. Security updates ignore the cooldown, so a known vulnerability still
# arrives at once.
updates:
  # Pinned actions are dependencies like any other, and nothing else reports when
  # one goes stale or its repository is archived.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'

  # The Prettier mirror pinned in .pre-commit-config.yaml ages the same way, and
  # the previous mirror sat archived for two years before anyone noticed. Keep
  # its version in step with the one in ci.yml when a bump arrives.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7

  # The pinned Keycloak base image. Unlike the two entries above, this one is part
  # of the shipped product rather than repository tooling, which is why its prefix
  # differs.
  - package-ecosystem: docker
    directory: /keycloak
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
    cooldown:
      default-days: 7

  # Postgres in the compose stack. Its tag floats within a major, so operators get
  # minor releases on their own pull and this entry only ever proposes the next
  # major, which needs pg_upgrade and so is breaking for them.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'fix!:'
    cooldown:
      default-days: 7
