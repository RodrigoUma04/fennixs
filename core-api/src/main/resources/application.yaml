spring:
  application:
    name: core-api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${CORE_DB_HOST:localhost}:5432/fennixs_core
    username: fennixs_app
    password: ${CORE_APP_PASSWORD}
  flyway:
    user: fennixs_migrator
    password: ${CORE_MIGRATOR_PASSWORD}
  jpa:
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: ${FENNIXS_OIDC_CLIENT_ID:fennixs-core-api}
            client-secret: ${CORE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,email
        provider:
          oidc:
            issuer-uri: ${FENNIXS_OIDC_ISSUER_URI:http://localhost:8080/realms/fennixs}

server:
  port: 8081
